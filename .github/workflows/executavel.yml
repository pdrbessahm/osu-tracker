# Roda os testes e gera o osu-tracker.exe no Windows.
# Com uma tag v* (ex.: v0.1.0), anexa o .exe a uma Release com o nome da tag.

name: executavel

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Testes
        shell: bash
        # quem falhou vira anotacao do GitHub, legivel sem abrir o log
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee testes.log && exit 0
          python -X utf8 -c "
          import re
          t = open('testes.log', encoding='utf-8', errors='replace').read()
          for b in re.split(r'\n(?==+\n(?:ERROR|FAIL):)', t):
              if re.match(r'=+\n(ERROR|FAIL):', b):
                  print('::error::' + b.strip()[-3000:].replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          "
          exit 1

  exe:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller --noconfirm --clean windows/osu-tracker.spec
      - name: Confere que o executavel abre e responde
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\osu-tracker.exe -ArgumentList "--help" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "osu-tracker.exe --help saiu com codigo $($p.ExitCode)" }
      - name: Confere que o painel sobe pelo executavel, com a pagina e os graficos embutidos
        shell: pwsh
        run: |
          $env:OSU_TRACKER_DIR = Join-Path $env:RUNNER_TEMP "osu-tracker-ci"
          $p = Start-Process -FilePath dist\osu-tracker.exe -ArgumentList "painel","--porta","8765","--sem-navegador" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { throw "o painel saiu com codigo $($p.ExitCode)" }
              try { $pagina = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing; $ok = $true } catch { }
            }
            if (-not $ok) { throw "o painel nao respondeu em 60 s" }
            if ($pagina.Content -notmatch "Mapas sugeridos para farmar") { throw "pagina do painel sem o conteudo esperado" }
            $js = Invoke-WebRequest http://127.0.0.1:8765/static/vendor/plotly.min.js -UseBasicParsing
            if ($js.RawContentLength -lt 1000000) { throw "plotly.min.js nao veio no executavel" }
            $api = Invoke-RestMethod http://127.0.0.1:8765/api/painel
            if (-not $api.aviso) { throw "sem configuracao o painel deveria avisar" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: osu-tracker-exe
          path: dist/osu-tracker.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: osu-tracker-exe
      - name: Anexa o .exe a Release da tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" osu-tracker.exe --repo "$GITHUB_REPOSITORY" --clobber
