# Roda os testes e gera o osu-tracker.exe no Windows.
# Com uma tag v* (ex.: v0.1.0), anexa o .exe a uma Release com o nome da tag.

name: executavel

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  exe:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller --noconfirm --clean windows/osu-tracker.spec
      - name: Confere que o executavel abre e responde
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\osu-tracker.exe -ArgumentList "--help" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "osu-tracker.exe --help saiu com codigo $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: osu-tracker-exe
          path: dist/osu-tracker.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: osu-tracker-exe
      - name: Anexa o .exe a Release da tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" osu-tracker.exe --repo "$GITHUB_REPOSITORY" --clobber
